    sectors: [IDXENERGY, IDXBASIC]
  - theme_id: tariffs_trade_war
    category: B
    title: Tariffs and trade wars
    severity: high
    keywords: [tariff, tariffs, tarif impor, tarif resiprokal, reciprocal tariff, perang dagang, trade war, bea masuk, import duties]
    require_any: [indonesia, ri, us, as, trump, china, tiongkok, amerika, ekspor, export]
    sectors: [IDXBASIC, IDXCYCLIC, IDXINDUST]
  - theme_id: shipping_chokepoints
    category: B
    title: Shipping chokepoints
    severity: medium
    keywords: [red sea, laut merah, strait of malacca, selat malaka, strait of hormuz, selat hormuz, suez canal, terusan suez, freight rates, ongkos kapal]
    sectors: [IDXTRANS, IDXENERGY]

