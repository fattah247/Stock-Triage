# Risk themes (docs/market_risk_plan.md, component 5c), seeded from every "Theme"
# row of docs/market_risk_factors.md. watch-sync tags each watched headline with
# the themes whose keywords it contains; the local LLM tags the rest, citing the
# exact words it relied on.
#
# Fields:
#   theme_id     stable id; findings, episodes and alerts refer to it
#   category     the catalog category letter (A-M)
#   severity     high | medium | low. Active high-severity themes count toward the
#                market state and appear on companies' exposure cards
#   keywords     any one of them tags an item (case-insensitive, whole words)
#   require_any  optional: the item must also contain one of these, to keep broad
#                words like "war" to the conflicts that matter for Indonesia
#   sectors      IDX-IC sector index codes the theme tends to hit
#
# Promoted findings (finding-promote) are added in the database, not here.
# market.risk_themes_path points at a different file if you keep your own.

themes:
  # A. Global money and risk appetite
  - theme_id: us_rates_fed
    category: A
    title: US rates and the Fed
    severity: medium
    keywords: [the fed, federal reserve, fomc, powell, suku bunga as, us treasury yield, treasury yields, imbal hasil treasury, us rate hike, kenaikan suku bunga fed]
    sectors: [IDXFINANCE, IDXPROPERT]
  - theme_id: global_risk_off
    category: A
    title: Global sell-off and risk aversion
    severity: high
    keywords: [global sell-off, global selloff, wall street anjlok, wall street plunges, risk-off, risk off, aksi jual global, bursa global anjlok, market crash, black monday]
    sectors: []
  - theme_id: em_contagion
    category: A
    title: Emerging-market contagion
    severity: medium
    keywords: [emerging market contagion, contagion, krisis pasar berkembang, emerging markets sell-off, capital outflow from emerging, arus modal keluar]
    sectors: []

  # B. China and world trade
  - theme_id: china_slowdown
