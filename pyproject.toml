[project]
name = "stock-triage"
version = "0.1.0"
description = "IDX Filing Analysis Automation System — local-first pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
